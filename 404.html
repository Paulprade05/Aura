<!doctype html>
<!--
  Página de error 404 de AURA. Vercel (y el servidor local) la sirven en la misma dirección que no existe,
  a cualquier profundidad (/loquesea, /html/loquesea.html…): por eso sus recursos usan rutas desde la raíz
  del servidor (/css/…, /js/…, /img/…) en lugar de rutas relativas. Es una página de servidor: no se abre por file://.
-->
<html lang="es" data-bs-theme="dark">
<head>
  <!-- Configuración técnica: codificación, ventana adaptable (con zonas seguras) y tema oscuro del navegador -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">

  <!-- SEO: título y descripción únicos, autoría, palabras clave, indexación (página de error: no se indexa, pero se siguen sus enlaces) y URL canónica -->
  <title>Página no encontrada: vuelve al inicio o pide ayuda — AURA</title>
  <meta name="description" content="La página que buscas no existe o ha cambiado de dirección. Vuelve al inicio de AURA, explora auraPhone, auraPad y auraBook o pide ayuda en Soporte.">
  <meta name="author" content="Paulprade05">
  <meta name="keywords" content="error 404, página no encontrada, AURA, auraPhone, auraPad, auraBook, soporte">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://aura-lyart-beta.vercel.app/404.html">

  <!-- Redes sociales: Open Graph (Facebook, LinkedIn, WhatsApp…) y tarjeta grande de X/Twitter; URLs absolutas -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AURA">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Página no encontrada: vuelve al inicio o pide ayuda">
  <meta property="og:description" content="La página que buscas no existe o ha cambiado de dirección. Vuelve al inicio de AURA, explora auraPhone, auraPad y auraBook o pide ayuda en Soporte.">
  <meta property="og:url" content="https://aura-lyart-beta.vercel.app/404.html">
  <meta property="og:image" content="https://aura-lyart-beta.vercel.app/img/og/og-aura.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo de AURA sobre fondo negro con un auraPad, un auraBook y un auraPhone Duo, y el lema «Lo mejor de AURA, en una sola tienda».">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Página no encontrada: vuelve al inicio o pide ayuda">
  <meta name="twitter:description" content="La página que buscas no existe o ha cambiado de dirección. Vuelve al inicio de AURA, explora auraPhone, auraPad y auraBook o pide ayuda en Soporte.">
  <meta name="twitter:image" content="https://aura-lyart-beta.vercel.app/img/og/og-aura.jpg">
  <meta name="twitter:image:alt" content="Logotipo de AURA sobre fondo negro con un auraPad, un auraBook y un auraPhone Duo, y el lema «Lo mejor de AURA, en una sola tienda».">

  <!-- Iconos: favicon (ICO y PNG), icono de la pantalla de inicio y manifiesto de la aplicación web -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/img/aura.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <!-- Manifiesto: por file:// (doble clic) el navegador lo bloquearía por CORS con un error en la consola, así que ahí se retira -->
  <script>(function () { if (location.protocol === 'file:') { var m = document.querySelector('link[rel="manifest"]'); if (m) { m.remove(); } } })();</script>

  <!-- Estilos: fuentes Inter y Kanit, Bootstrap 5.3, Bootstrap Icons y hoja de AURA (no necesita hoja propia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/aura.css" rel="stylesheet">

  <!-- Scripts: catálogo y núcleo de AURA, síncronos y en este orden (definen <aura-header> y <aura-footer> antes del cuerpo) -->
  <!-- Dirección profunda (/a/b/c): aura-core.js pinta enlaces relativos a la raíz o a /html/, así que se fija esa <base>
       (como la base también afecta a los «#», el enlace «Saltar al contenido» pasa a apuntar a esta misma dirección) -->
  <script>
    (function () {
      var p = location.pathname;
      if (!/^https?:$/.test(location.protocol) || /^\/[^\/]*$/.test(p) || /^\/html\/[^\/]*$/i.test(p)) { return; }
      var base = document.createElement('base');
      base.href = /[\/\\]html([\/\\]|$)/i.test(p) ? '/html/' : '/';
      document.head.appendChild(base);
      document.addEventListener('DOMContentLoaded', function () {
        var skip = document.querySelector('.aura-skip');
        if (skip) { skip.setAttribute('href', p + location.search + '#contenido'); }
      });
    })();
  </script>
  <script src="/js/data.js"></script>
  <script src="/js/aura-core.js"></script>
</head>
<body>
  <a class="aura-skip" href="#contenido">Saltar al contenido</a>
  <aura-header active="" ribbon="off"></aura-header>

  <main id="contenido">

    <!-- ================= Error 404: qué ha pasado y por dónde seguir ================= -->
    <section class="aura-section aura-section--center" aria-labelledby="error-titulo">
      <div class="aura-container aura-container--narrow">
        <div class="aura-empty">
          <span class="aura-empty__icon"><i class="bi bi-signpost-split" aria-hidden="true"></i></span>
          <p class="aura-eyebrow aura-eyebrow--mono">Error 404</p>
          <h1 class="aura-h1" id="error-titulo">No encontramos esta página.</h1>
          <p class="aura-lead aura-empty__text">Puede que la dirección esté mal escrita o que la página haya cambiado de sitio. Sigue por aquí:</p>
          <div class="aura-empty__actions">
            <a class="aura-btn aura-btn--primary" href="/index.html">Ir al inicio</a>
            <a class="aura-btn aura-btn--secondary" href="/html/soporte.html">Pedir ayuda en Soporte</a>
          </div>
          <!-- Enlaces útiles: las tres familias de la gama -->
          <nav aria-label="Explora la gama">
            <ul class="aura-cluster list-unstyled justify-content-center mb-0">
              <li><a class="aura-link" href="/html/auraphone.html">Ver auraPhone</a></li>
              <li><a class="aura-link" href="/html/aurapad.html">Ver auraPad</a></li>
              <li><a class="aura-link" href="/html/aurabook.html">Ver auraBook</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </section>

  </main>

  <aura-footer crumbs="Página no encontrada"></aura-footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/aura-ui.js"></script>
</body>
</html>
